# ╔═══════════════════════════════════════════════════════╗
# ║  Glasveil lock screen (hyprlock)                      ║
# ║  复刻 Noctalia 锁屏观感：模糊壁纸 + 居中大时钟 + 卡片式密码框  ║
# ╚═══════════════════════════════════════════════════════╝
#
# 配色全部来自 matugen（跟随壁纸与明暗）：
#   colors.conf         —— 标准 M3 角色色
#   hyprlock-colors.conf —— 带 alpha 的卡片/tint 派生色
source = ~/.cache/matugen/hypr/colors.conf
source = ~/.cache/matugen/hypr/hyprlock-colors.conf

$font = JetBrains Maple Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2.5, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── 背景：当前壁纸 + 毛玻璃模糊（对应 Noctalia 的 blurred_desktop / blur_intensity 0.5）──
background {
    monitor =
    path = ~/.cache/.current_wallpaper
    color = $surface

    blur_size = 6
    blur_passes = 4
    noise = 0.015
    contrast = 1.05
    brightness = 0.92
    vibrancy = 0.18
    vibrancy_darkness = 0.05
}

# ── 大时钟（居中偏上，Noctalia 锁屏的主视觉）──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $clock_color
    font_size = 96
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    position = 0, 12%
    halign = center
    valign = center
}

# ── 日期 ──
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $date_color
    font_size = 20
    font_family = $font
    position = 0, 4%
    halign = center
    valign = center
}

# ── 登录框：圆角卡片（对应 Noctalia login_box：surface_variant 88% + outline 描边）──
input-field {
    monitor =
    size = 14%, 3.2%
    outline_thickness = 2
    rounding = 18

    dots_size = 0.25
    dots_spacing = 0.6
    dots_center = true
    dots_rounding = -1

    outer_color = $card_border
    inner_color = $card
    font_color = $clock_color
    check_color = $accent
    fail_color = $fail
    capslock_color = $fail

    fade_on_empty = false
    placeholder_text = <i>输入密码…</i>

    position = 0, -8%
    halign = center
    valign = center
}
