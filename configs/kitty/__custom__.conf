# ==============================================================================
# Kitty Custom Configuration / 用户 Kitty 私有配置
# ==============================================================================
# Any configuration options placed in this file will override standard settings
# and will be safely preserved across updates of the Nyxuri dotfiles.
#
# 在此文件中添加的任何 Kitty 配置项都将覆盖默认设置，
# 并且在 Nyxuri 更新部署时会被完整保留，不会丢失。
# ==============================================================================

# ── 字体（取自 ~/.config/kitty~ 的配置）────────────────────
# 主字体：JetBrains Mono；字号 9.0
# 原配置没有任何字体微调项（无 bold_font / italic_font / font_features /
# text_composition_strategy / adjust_line_height 等），故此处保持一致。
# 中文缺字由 fontconfig 回落（Noto Sans CJK），Nerd 图标沿用 Maple Mono NF 映射。
font_family JetBrains Mono
font_size 9.0
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Maple Mono NF
