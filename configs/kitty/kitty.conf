# ══════════════════════════════════════════════════════════════
# 本文件定义的快捷键（最常用在前，逐条说明见同目录 README-keys.md）
# ──────────────────────────────────────────────────────────────
#   Ctrl+C            有选中就复制并清选中；否则中断
#   Ctrl+V  或 右键    粘贴
#   Ctrl+Shift+J      上下分屏        Ctrl+Shift+H  左右分屏
#   Ctrl+Shift+N      在当前窗口开新页（tab）
#   Ctrl+Backspace    删前一个词        Ctrl+Delete  删后一个词
#   Ctrl+=  Ctrl+-  Ctrl+0   字号 大 / 小 / 还原
#   Ctrl+A            把 @text 送进剪贴板（不是「全选」，见 README）
#   Ctrl+Shift+K      用 less 翻回滚（原本在 Ctrl+Shift+H，已被左右分屏占用）
# ──────────────────────────────────────────────────────────────
# 下面这些是 kitty 内置的，改这里不会影响；完整键位按 Ctrl+Shift+F1
#   Ctrl+Shift+F5 重载本文件   Ctrl+Shift+Enter 按布局自动分屏
# ══════════════════════════════════════════════════════════════

window_padding_width 5
hide_window_decorations yes
background_opacity 0.9
font_family JetBrains Mono
font_size 12.0
remember_window_size no
confirm_os_window_close 0
shell fish
cursor_trail 1 
cursor_shape block
shell_integration no-cursor

# Windows-like shortcuts
# Copy: if there is a selection, copy and clear it; otherwise, send Ctrl+C to interrupt
map ctrl+c copy_and_clear_or_interrupt

# Paste from clipboard (Ctrl+V and Mouse Right Click)
copy_on_select no
map ctrl+v paste_from_clipboard
mouse_map right press ungrabbed paste_from_clipboard

# Fast word deletion (Windows-style)
map ctrl+backspace send_text all \x17
map ctrl+delete send_text all \x1bd

# Select All (Copy entire scrollback to clipboard)
map ctrl+a pipe @text clipboard sh -c "wl-copy 2>/dev/null || xclip -selection clipboard"

# Font size adjustments (Windows/Browser style)
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Ctrl+滚轮调字号：kitty 默认没有这个绑定，要就自己加 mouse_map（见 README-keys.md）

# Split direction / 分屏方向
# kitty 默认的 Ctrl+Shift+Enter 是「按当前布局自动分」，方向不可控；
# 这两条强制指定，和 tmux 的 split-window -v / -h 手感一致。
#
# 注意 kitty 的命名是「分割线的方向」：
#   hsplit = 横着切一刀 → 两个窗口一上一下（上下分）
#   vsplit = 竖着切一刀 → 两个窗口左右并排（左右分）
map ctrl+shift+j launch --cwd=current --location=hsplit
map ctrl+shift+h launch --cwd=current --location=vsplit

# New tab in current OS window / 在当前 kitty 窗口开新页
# 注意：kitty 默认把 Ctrl+Shift+N 绑给 new_os_window（开一个全新的 OS 窗口），
# 这条会把它挤掉。想保留原行为，把下面 ctrl+shift+m 那行的注释去掉。
map ctrl+shift+n launch --cwd=current --type=tab
# map ctrl+shift+m new_os_window

# Ctrl+Shift+H 原本是 kitty 的 show_scrollback（用 less 翻回滚缓冲），
# 上面把它改成左右分屏了，这里把它挪到空着的 Ctrl+Shift+K。
# 不想要的话删掉这一行即可，其他不受影响。
map ctrl+shift+k show_scrollback

# User Custom Configurations / 用户私有配置挂载点

# ══════════════════════════════════════════════════════════════
# 主题与覆盖层 —— 加载顺序即优先级（后加载者覆盖先加载者）
# ══════════════════════════════════════════════════════════════
# 1) 基础配色（由 matugen 从壁纸生成，自动生成，勿手改）
include themes/noctalia.conf
# 2) 动态覆盖层（由 matugen 从壁纸生成，自动生成，勿手改）
include themes/noctalia-override.conf
# 3) 用户私有配置 —— 始终最高优先级
#    Nyxuri Dunder 协议：含 __custom__ 的文件跨更新保留

























# >>> cube-tune (per-mode xterm 256 palette)
include themes/xterm-cube-light.conf
# <<< cube-tune

include __custom__.conf
