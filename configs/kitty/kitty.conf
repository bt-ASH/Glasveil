window_padding_width 5
hide_window_decorations yes
background_opacity 0.9
font_family JetBrains Mono
font_size 12.0
remember_window_size no
confirm_os_window_close 0
shell fish
cursor_trail 1 
cursor_shape block
shell_integration no-cursor

# Windows-like shortcuts
# Copy: if there is a selection, copy and clear it; otherwise, send Ctrl+C to interrupt
map ctrl+c copy_and_clear_or_interrupt

# Paste from clipboard (Ctrl+V and Mouse Right Click)
copy_on_select no
map ctrl+v paste_from_clipboard
mouse_map right press ungrabbed paste_from_clipboard

# Fast word deletion (Windows-style)
map ctrl+backspace send_text all \x17
map ctrl+delete send_text all \x1bd

# Select All (Copy entire scrollback to clipboard)
map ctrl+a pipe @text clipboard sh -c "wl-copy 2>/dev/null || xclip -selection clipboard"

# Font size adjustments (Windows/Browser style)
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Mouse wheel font size adjustment (Ctrl + Scroll)

# User Custom Configurations / 用户私有配置挂载点

# ══════════════════════════════════════════════════════════════
# 主题与覆盖层 —— 加载顺序即优先级（后加载者覆盖先加载者）
# ══════════════════════════════════════════════════════════════
# 1) 基础配色（由 matugen 从壁纸生成，自动生成，勿手改）
include themes/noctalia.conf
# 2) 动态覆盖层（由 matugen 从壁纸生成，自动生成，勿手改）
include themes/noctalia-override.conf
# 3) 用户私有配置 —— 始终最高优先级
