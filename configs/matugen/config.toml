
[config]

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook='rm ~/.config/waybar-niri-Win11Like/colors.css && ln -s ~/.config/waybar/colors.css ~/.config/waybar-niri-Win11Like/colors.css && bash ~/.config/scripts/darken-primary.sh'


[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update &'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/colors.ini'

# kitty 基础配色（Nyxuri themes/noctalia.conf 对应物）
[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/noctalia.conf'
post_hook = "pkill -SIGUSR1 -x kitty || true"

# 兼容旧路径：~/.config/kitty/current-theme.conf（nvim kitty-theme.lua / ghostty 迁移脚本读取）
[templates.kitty_current]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/current-theme.conf'

# kitty 动态覆盖层（Nyxuri kitty-override.conf 同款：primary 统管 fg/cursor/color7/15）
[templates.kitty_override]
input_path = '~/.config/matugen/templates/kitty-override.conf'
output_path = '~/.config/kitty/themes/noctalia-override.conf'

[templates.fcitx5]
input_path = '~/.config/matugen/templates/fcitx5-theme.conf'
output_path = '~/.local/share/fcitx5/themes/Matugen/theme.conf'
post_hook = 'busctl --user --auto-start=no call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true'

# ── NyxMellow（Nyxuri 输入法皮肤，素材来自 ~/Nyxuri/assets/fcitx5/nyxmellow）──
# 由 matugen 从壁纸渲染，风格与 Nyxuri 的 NyxMellow 完全一致
[templates.fcitx5_nyxmellow_theme]
input_path = '~/.config/matugen/templates/fcitx5-nyxmellow/theme.conf'
output_path = '~/.local/share/fcitx5/themes/nyxmellow/theme.conf'
pre_hook = 'mkdir -p ~/.local/share/fcitx5/themes/nyxmellow'
post_hook = 'busctl --user --auto-start=no call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true'

[templates.fcitx5_nyxmellow_panel]
input_path = '~/.config/matugen/templates/fcitx5-nyxmellow/panel.svg'
output_path = '~/.local/share/fcitx5/themes/nyxmellow/panel.svg'

[templates.fcitx5_nyxmellow_highlight]
input_path = '~/.config/matugen/templates/fcitx5-nyxmellow/highlight.svg'
output_path = '~/.local/share/fcitx5/themes/nyxmellow/highlight.svg'

[templates.mako]
input_path = '~/.config/matugen/templates/mako-colors.conf'
output_path = '~/.config/mako/colors.conf'
post_hook='makoctl reload &'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'killall -SIGUSR1 btop && killall -SIGUSR2 btop &'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.cache/matugen/cava-colors.ini'
pre_hook = 'mkdir -p ~/.cache/matugen'
post_hook = "bash ~/.config/matugen/scripts/inject-cava-colors.sh"

[templates.clipe]
input_path = '~/.config/matugen/templates/clipse-theme.json'
output_path = '~/.cache/matugen/clipse-theme.json'
pre_hook = 'mkdir -p ~/.cache/matugen'
post_hook = "bash ~/.config/matugen/scripts/inject-clipse-theme.sh"

[templates.starship]
input_path = '~/.config/matugen/templates/starship-colors.toml'
output_path = '~/.config/starship.toml'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

