[templates.neovim]
input_path = '~/.config/matugen/templates/nvim-catppuccin.lua'
output_path = '~/.config/nvim/lua/user/matugen-catppuccin.lua'
post_hook = "bash -c 'sleep 0.5 && for s in /tmp/nvim-*; do nvim --server \"$s\" --remote-send \"<Esc>:silent luafile ~/.config/nvim/lua/user/matugen-catppuccin.lua<Enter>\" 2>/dev/null; nvim --server \"$s\" --remote-send \":lua require(\\\"kitty-theme\\\").apply()<Enter>\" 2>/dev/null || true; done'"

[templates.tmux]
input_path = '~/.config/matugen/templates/tmux-catppuccin.conf'
output_path = '~/.config/tmux/user/matugen-catppuccin.conf'
post_hook = "tmux source ~/.config/tmux/user/matugen-catppuccin.conf 2>/dev/null && tmux run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux' >/dev/null 2>&1 & || true"

[templates.astroui]
input_path = '~/.config/matugen/templates/nvim-astroui.lua'
output_path = '~/.config/nvim/lua/user/matugen-astroui.lua'
pre_hook = 'mkdir -p ~/.config/nvim/lua/user'
post_hook = "bash -c 'sleep 0.3; for s in ${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/nvim.*/0 /tmp/nvim*/0; do [ -S \"$s\" ] && nvim --server \"$s\" --remote-send \"<Esc>:silent! lua require(\\\"astroui.status.heirline\\\").refresh_colors()<Enter>\" >/dev/null 2>&1; done; true'"

