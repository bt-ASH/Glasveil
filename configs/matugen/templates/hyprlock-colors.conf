# hyprlock 语义色（带透明度）—— 由 matugen 从壁纸生成
# 供 ~/.config/niri/hyprlock.conf 使用（复刻 Noctalia 锁屏观感）
$tint          = rgba({{colors.surface.default.hex_stripped}}47)         # 表面色 28% 叠层（对应 Noctalia tint_intensity 0.3）
$card          = rgba({{colors.surface_variant.default.hex_stripped}}e0) # 登录框底：surface_variant 88%
$card_border   = rgba({{colors.outline.default.hex_stripped}}66)         # 登录框描边：outline 40%
$clock_color   = {{colors.on_surface.default.hex}}
$date_color    = {{colors.on_surface_variant.default.hex}}
$fail          = {{colors.error.default.hex}}
$accent        = {{colors.primary.default.hex}}
