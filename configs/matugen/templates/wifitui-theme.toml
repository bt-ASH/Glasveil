# wifitui theme (generated by matugen from the wallpaper)
# Schema: internal/tui/theme.go in shazow/wifitui
# Values are "#rrggbb"; wifitui also accepts ["#light", "#dark"] pairs.

Primary  = "{{colors.primary.default.hex}}"             # accents, selection, active radio
Subtle   = "{{colors.on_surface_variant.default.hex}}"  # secondary text, details
Success  = "{{colors.tertiary.default.hex}}"            # connected / success
Error    = "{{colors.error.default.hex}}"               # failures, disabled radio
Normal   = "{{colors.on_surface.default.hex}}"          # main text
Disabled = "{{colors.outline_variant.default.hex}}"     # disabled entries
Border   = "{{colors.outline.default.hex}}"             # separators, frames

SignalHigh = "{{colors.tertiary.default.hex}}"          # strong signal
SignalLow  = "{{colors.error.default.hex}}"             # weak signal
Saved      = "{{colors.secondary.default.hex}}"         # saved networks
