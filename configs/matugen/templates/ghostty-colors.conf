# Ghostty 配色, 由 matugen 随壁纸生成 (与 kitty 模板 kitty-colors.conf 保持一致)
# 输出: ~/.config/ghostty/themes/Matugen, 由 main.conf 中 theme = Matugen 加载

# kitty: cursor / cursor_text_color
cursor-color = {{colors.secondary.default.hex}}
cursor-text = {{colors.on_surface_variant.default.hex}}

# kitty: foreground / background
foreground = {{colors.on_surface.default.hex}}
background = {{colors.surface.default.hex}}
selection-foreground = {{colors.on_secondary.default.hex}}
selection-background = {{colors.secondary_fixed_dim.default.hex}}
# kitty: url_color {{colors.primary.default.hex}} (ghostty 1.3 暂无链接颜色选项)

palette = 0=#4c4c4c
# red
palette = 1=#ac8a8c
# green (与 blue 同色, 跟随主色)
palette = 2={{colors.primary.default.hex}}
# yellow
palette = 3=#aca98a
# blue
palette = 4={{colors.primary.default.hex}}
# magenta
palette = 5={{colors.tertiary.default.hex}}
# cyan (绑定次要色, 利用 fixed_dim 原生实现"调暗"效果)
palette = 6={{colors.secondary_fixed_dim.default.hex}}
# white
palette = 7=#f0f0f0
palette = 8={{colors.outline.default.hex}}
palette = 9=#c49ea0
palette = 10=#a39ec4
palette = 11=#c4c19e
palette = 12=#a39ec4
palette = 13={{colors.on_tertiary_container.default.hex}}
palette = 14={{colors.secondary.default.hex}}
palette = 15=#e7e7e7
