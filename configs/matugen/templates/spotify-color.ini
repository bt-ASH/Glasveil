; ─────────────────────────────────────────────────────────────
; Glasveil × Spicetify 配色（matugen 模板）
;   模板:   configs/matugen/templates/spotify-color.ini
;   渲染到: ~/.cache/matugen/spotify-color.ini
;   合并进: ~/.config/spicetify/Themes/marketplace/color.ini
;           （由 scripts/inject-spicetify-color.sh 做 section 级替换，
;             保留 [Marketplace] / [ZedMatch] 等已有 section）
;   两个 section: [Glasveil] 浅色 / [Glasveil-Dark] 深色
;   值一律用 hex_stripped（不带井号的 6 位十六进制），大写由注入脚本统一转换
; ─────────────────────────────────────────────────────────────

[Glasveil]
text               = {{colors.on_surface.light.hex_stripped}}
subtext            = {{colors.on_surface_variant.light.hex_stripped}}
main               = {{colors.background.light.hex_stripped}}
main-elevated      = {{colors.surface_container_low.light.hex_stripped}}
highlight          = {{colors.surface_container_high.light.hex_stripped}}
highlight-elevated = {{colors.surface_container_highest.light.hex_stripped}}
sidebar            = {{colors.surface_container_low.light.hex_stripped}}
player             = {{colors.surface_container_low.light.hex_stripped}}
card               = {{colors.surface_container.light.hex_stripped}}
shadow             = {{colors.outline_variant.light.hex_stripped}}
selected-row       = {{colors.surface_container_highest.light.hex_stripped}}
button             = {{colors.surface_container_high.light.hex_stripped}}
button-active      = {{colors.surface_container_highest.light.hex_stripped}}
button-disabled    = {{colors.surface_container_low.light.hex_stripped}}
tab-active         = {{colors.surface_container_highest.light.hex_stripped}}
notification       = {{colors.surface_container.light.hex_stripped}}
notification-error = {{colors.error.light.hex_stripped}}
misc               = {{colors.outline.light.hex_stripped}}
accent             = {{colors.primary.light.hex_stripped}}
accent-blue        = {{colors.tertiary.light.hex_stripped}}
accent-green       = {{colors.tertiary.light.hex_stripped}}
accent-red         = {{colors.error.light.hex_stripped}}
accent-yellow      = {{colors.tertiary.light.hex_stripped}}
accent-purple      = {{colors.primary.light.hex_stripped}}
syntax-keyword     = {{colors.primary.light.hex_stripped}}
syntax-string      = {{colors.tertiary.light.hex_stripped}}
syntax-function    = {{colors.secondary.light.hex_stripped}}
syntax-type        = {{colors.primary.light.hex_stripped}}
syntax-comment     = {{colors.outline.light.hex_stripped}}
syntax-error       = {{colors.error.light.hex_stripped}}

[Glasveil-Dark]
text               = {{colors.on_surface.dark.hex_stripped}}
subtext            = {{colors.on_surface_variant.dark.hex_stripped}}
main               = {{colors.background.dark.hex_stripped}}
main-elevated      = {{colors.surface_container_low.dark.hex_stripped}}
highlight          = {{colors.surface_container_high.dark.hex_stripped}}
highlight-elevated = {{colors.surface_container_highest.dark.hex_stripped}}
sidebar            = {{colors.surface_container_low.dark.hex_stripped}}
player             = {{colors.surface_container_low.dark.hex_stripped}}
card               = {{colors.surface_container.dark.hex_stripped}}
shadow             = {{colors.outline_variant.dark.hex_stripped}}
selected-row       = {{colors.surface_container_highest.dark.hex_stripped}}
button             = {{colors.surface_container_high.dark.hex_stripped}}
button-active      = {{colors.surface_container_highest.dark.hex_stripped}}
button-disabled    = {{colors.surface_container_low.dark.hex_stripped}}
tab-active         = {{colors.surface_container_highest.dark.hex_stripped}}
notification       = {{colors.surface_container.dark.hex_stripped}}
notification-error = {{colors.error.dark.hex_stripped}}
misc               = {{colors.outline.dark.hex_stripped}}
accent             = {{colors.primary.dark.hex_stripped}}
accent-blue        = {{colors.tertiary.dark.hex_stripped}}
accent-green       = {{colors.tertiary.dark.hex_stripped}}
accent-red         = {{colors.error.dark.hex_stripped}}
accent-yellow      = {{colors.tertiary.dark.hex_stripped}}
accent-purple      = {{colors.primary.dark.hex_stripped}}
syntax-keyword     = {{colors.primary.dark.hex_stripped}}
syntax-string      = {{colors.tertiary.dark.hex_stripped}}
syntax-function    = {{colors.secondary.dark.hex_stripped}}
syntax-type        = {{colors.primary.dark.hex_stripped}}
syntax-comment     = {{colors.outline.dark.hex_stripped}}
syntax-error       = {{colors.error.dark.hex_stripped}}
