# 蓝牙耳机重连后音量恢复问题的修复
# 默认 A2DP 使用耳机端硬件音量(AVRCP absolute volume)，
# 部分耳机固件不记忆音量，重连时上报 100% 覆盖主机保存值。
# 这里将 A2DP 改为软件音量，由 PipeWire 记忆并恢复；
# 通话类 profile(hfp/hsp) 保留硬件音量以保证通话质量。
#
# 注意 (wireplumber 0.5.x / pipewire >= 1.x)：
# 1. bluez5.hw-volume 是 per-device 属性，必须通过 monitor.bluez.rules
#    的 update-props 应用到设备上；写在 monitor.bluez.properties 下
#    会被静默忽略。
# 2. profile 名使用下划线 (a2dp_sink/hfp_hf/...)，不能写连字符，
#    否则同样不生效 (spa_bt_profiles_from_json_array 只认下划线名)。
monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.hw-volume = [ hfp_ag hsp_ag hfp_hf hsp_hs ]
      }
    }
  }
]
